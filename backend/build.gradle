plugins {
    id 'java'
    id 'org.graalvm.buildtools.native' version '0.10.6' apply false
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bettergametracker'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.xerial:sqlite-jdbc'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'better-game-tracker.open-browser', 'false'
}

// Plain browser assets: no Node runtime or frontend framework required.
tasks.named('processResources') {
    from('frontend') { into 'static' }
}

// Native packaging is opt-in; regular JAR builds do not run AOT processing.
if (providers.gradleProperty('native').isPresent()) {
    apply plugin: 'org.graalvm.buildtools.native'
    graalvmNative {
        binaries {
            main {
                imageName = 'BetterGameTracker'
                buildArgs.add('-H:+AddAllCharsets')
            }
        }
    }
    tasks.named('processAot') {
        args '--spring.profiles.active=local', '--better-game-tracker.open-browser=false'
    }
}
