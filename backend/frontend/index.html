<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Your games, playthroughs and playing time in one place."
    />
    <title>BetterGameTracker</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/" class="brand"
        >BetterGameTracker<span>Your personal game library</span></a
      >
      <nav>
        <button id="add-game">Add game</button
        ><button id="logout" hidden>Sign out</button>
      </nav>
    </header>
    <main>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="login" hidden>
        <h1>Your next great playthrough starts here.</h1>
        <p>Sign in to open your personal game library.</p>
        <a class="button" href="/oauth2/authorization/google"
          >Continue with Google</a
        >
      </section>
      <section id="library">
        <div class="section-heading">
          <h1>Your library</h1>
          <span id="count"></span>
        </div>
        <div id="games" class="games"></div>
        <section id="detail" hidden></section>
      </section>
    </main>
    <dialog id="editor">
      <form id="edit-form">
        <div class="section-heading">
          <h2 id="editor-title"></h2>
          <button type="button" id="close-editor" class="secondary">
            Cancel
          </button>
        </div>
        <div id="fields"></div>
        <p id="form-error" role="alert"></p>
        <button type="submit">Save</button>
      </form>
    </dialog>
    <footer>Keep track of the games you make time for.</footer>
  </body>
</html>
