spring:
  config:
    activate:
      on-profile: hosted
  datasource:
    url: ${BETTER_GAME_TRACKER_DATABASE_URL}
    username: ${BETTER_GAME_TRACKER_DATABASE_USERNAME}
    password: ${BETTER_GAME_TRACKER_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    placeholders:
      uuidType: UUID
