name: Backend release checks
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bgt_test
          POSTGRES_USER: bgt_test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bgt_test -d bgt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
        env:
          BGT_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/bgt_test
          BGT_TEST_POSTGRES_USERNAME: bgt_test
          BGT_TEST_POSTGRES_PASSWORD: test-only-password
      - run: python3 scripts/smoke.py java -jar build/libs/better-game-tracker-backend-0.0.1-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: ./gradlew -Pnative nativeCompile
      - name: Smoke test native executable
        run: |
          binary=build/native/nativeCompile/BetterGameTracker
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          python scripts/smoke.py "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: BetterGameTracker-${{ matrix.os }}
          path: backend/build/native/nativeCompile/BetterGameTracker*
